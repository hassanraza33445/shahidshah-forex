</head><body><main><h1>Opening page…</h1><p id="msg">Please wait.</p></main>

  document.querySelector('h1').textContent='404';
  document.getElementById('msg').innerHTML='Page not found. <a href="/">Go to Home</a>';
})();
</script></body></html>
