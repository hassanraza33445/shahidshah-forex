name: Premium Member Login and Mobile UI QA
on:
  pull_request:
    paths:
      - 'auth/**'
      - 'app/**'
      - 'assets/sm-auth*'
      - 'assets/sm-member-*'
      - 'market-intelligence/**'
      - 'learning-hub.html'
      - 'content-studio/**'
      - 'economic-calendar/**'
      - 'market-reaction/**'
      - 'notifications/**'
      - 'scripts/sm-member-auth-qa.mjs'
      - '.github/workflows/sm-member-auth-qa.yml'
jobs:
  member-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Syntax verify auth, gate and member UI JavaScript
        run: |
          node --check assets/sm-auth.js
          node --check assets/sm-member-gate.js
          node --check assets/sm-member-app.js
      - name: Simulate signup/login/secure redirects and new mobile/desktop UI
        run: node scripts/sm-member-auth-qa.mjs
