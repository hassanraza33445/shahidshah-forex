name: Live Market Notifications API checks
on:
  pull_request:
    paths:
      - 'scripts/check-notifications-live.mjs'
      - '.github/workflows/market-notifications-live.yml'
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real HOT alerts, editorial labels, filters, private settings and push disabled
        run: node scripts/check-notifications-live.mjs
