name: One-time Market Reaction production QA
on:
  pull_request:
    paths:
      - 'scripts/live-market-reaction-qa.mjs'
      - '.github/workflows/live-market-reaction-qa.yml'
jobs:
  public-site:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Inspect live published market, calendar, reactions and homepage
        run: node scripts/live-market-reaction-qa.mjs
