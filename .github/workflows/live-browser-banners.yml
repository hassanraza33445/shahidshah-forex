name: Live browser banner diagnostics
on:
  pull_request:
    paths:
      - 'scripts/diagnose-live-banners.mjs'
      - '.github/workflows/live-browser-banners.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/diagnose-live-banners.mjs
