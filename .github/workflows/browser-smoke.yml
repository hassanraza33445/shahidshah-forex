name: Browser smoke tests
on:
  pull_request:
    paths:
      - 'market-intelligence/**'
      - 'content-studio/**'
      - 'scripts/smoke-browser.mjs'
      - 'ai-*/index.html'
      - 'expo.html'
      - 'webinar-admin/index.html'
      - '.github/workflows/browser-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install browser runtime
        run: npx playwright install chromium --with-deps
      - name: Start static website server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shahid-web-smoke.log 2>&1 &
      - name: Run responsive and redirect smoke tests
        run: node scripts/smoke-browser.mjs
