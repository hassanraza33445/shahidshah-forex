name: One-time Premium Member Live QA
on:
  pull_request:
    paths:
      - 'scripts/live-member-ui-qa.mjs'
      - '.github/workflows/live-member-ui-qa.yml'
jobs:
  verify-production:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check real live login/signup and member redirects, desktop/mobile
        run: node scripts/live-member-ui-qa.mjs
