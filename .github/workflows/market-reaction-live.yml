name: Live Market Reaction API smoke
on:
  pull_request:
    paths:
      - 'scripts/check-market-reaction-live.mjs'
      - '.github/workflows/market-reaction-live.yml'
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live public data integrity and admin security
        run: node scripts/check-market-reaction-live.mjs
