name: Single Admin Panel integration checks
on:
  pull_request:
    paths:
      - "admin/index.html"
      - "assets/sm-admin-six-navigation.js"
      - "assets/sm-admin-six-navigation.css"
      - "scripts/sm-admin-six-nav-qa.mjs"
      - "assets/sm-admin-premium-dashboard.js"
      - "assets/sm-admin-premium-dashboard.css"
      - "scripts/sm-admin-premium-dashboard-qa.mjs"
      - "webinar-admin/index.html"
      - "vercel.json"
      - "scripts/sm-clean-admin-route-qa.mjs"
      - "admin-panel.html"
      - "webinar-admin.html"
      - "assets/sm-admin-unified.js"
      - "assets/sm-admin-unified.css"
      - "scripts/sm-unified-admin-qa.mjs"
      - ".github/workflows/sm-unified-admin-qa.yml"
  push:
    branches: [main]
    paths:
      - "admin/index.html"
      - "assets/sm-admin-six-navigation.js"
      - "assets/sm-admin-six-navigation.css"
      - "scripts/sm-admin-six-nav-qa.mjs"
      - "assets/sm-admin-premium-dashboard.js"
      - "assets/sm-admin-premium-dashboard.css"
      - "scripts/sm-admin-premium-dashboard-qa.mjs"
      - "webinar-admin/index.html"
      - "vercel.json"
      - "scripts/sm-clean-admin-route-qa.mjs"
      - "admin-panel.html"
      - "webinar-admin.html"
      - "assets/sm-admin-unified.js"
      - "assets/sm-admin-unified.css"
      - "scripts/sm-unified-admin-qa.mjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/sm-admin-unified.js
      - run: node scripts/sm-unified-admin-qa.mjs
      - run: node scripts/sm-clean-admin-route-qa.mjs
      - run: node --check assets/sm-admin-premium-dashboard.js
      - run: node scripts/sm-admin-premium-dashboard-qa.mjs
      - run: node --check assets/sm-admin-six-navigation.js
      - run: node scripts/sm-admin-six-nav-qa.mjs
