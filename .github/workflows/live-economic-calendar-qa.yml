name: One-time live economic calendar QA
on:
  pull_request:
    paths:
      - 'scripts/live-economic-calendar-qa.mjs'
      - '.github/workflows/live-economic-calendar-qa.yml'
jobs:
  production-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Test published calendar on apex/www, desktop/mobile
        run: node scripts/live-economic-calendar-qa.mjs
