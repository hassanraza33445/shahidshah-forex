name: Live Economic Calendar API verification
on:
  pull_request:
    paths:
      - 'scripts/check-economic-calendar-live.mjs'
      - '.github/workflows/economic-calendar-live.yml'
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calendar data provenance, public filters and admin security
        run: node scripts/check-economic-calendar-live.mjs
